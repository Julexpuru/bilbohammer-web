services:
  db:
    image: postgres:16-alpine
    container_name: bilbohammer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bh_user
      POSTGRES_PASSWORD: bh_pass
      POSTGRES_DB: bilbohammer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: sh -lc "npx prisma generate && (npx prisma migrate deploy || npx prisma db push) && npm run dev"
    container_name: bilbohammer_web
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./web/.env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - ./web:/app          # montas el código local en /app
      - /app/node_modules   # node_modules queda en volumen

  sftp:
    image: atmoz/sftp
    command: editor:editor:1001
    volumes:
      - ./web:/home/editor/web
    ports:
      - "2222:22"

volumes:
  pgdata:
